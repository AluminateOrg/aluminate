services:
  database:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: aluminatedb
      POSTGRES_USER: senira
      POSTGRES_PASSWORD: 2002
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aluminate-network

  backend:
    build:
      context: ./aluminate-organization-backend
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/aluminatedb
      SPRING_DATASOURCE_USERNAME: senira
      SPRING_DATASOURCE_PASSWORD: 2002
    ports:
      - "8098:8098"
    networks:
      - aluminate-network

  frontend:
    build:
      context: ./aluminate-organization-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - aluminate-network

volumes:
  pgdata:

networks:
  aluminate-network: