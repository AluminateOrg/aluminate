version: '3.9'

services:
  # -------------------------------------------------------------------
  # 1. DATABASE (PostgreSQL) - Dynamic Host Port
  # -------------------------------------------------------------------
  database:
    image: postgres:15
    container_name: organization-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432" # Dynamic host port -> Container port 5432
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 2. MONGO DB (Chat Data) - Dynamic Host Port
  # -------------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: organization-mongo
    restart: unless-stopped
    # MONGO_INITDB variables are used for initial user creation
    environment:
      - MONGO_INITDB_ROOT_USERNAME=senira
      - MONGO_INITDB_ROOT_PASSWORD=senira
    ports:
      - "27017" # Dynamic host port -> Container port 27017
    volumes:
      - mongo_data:/data/db
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 3. REDIS (Caching and PubSub) - Dynamic Host Port
  # -------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: organization-redis
    restart: unless-stopped
    ports:
      - "6379" # Dynamic host port -> Container port 6379
    volumes:
      - redis_data:/data
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 4. BACKEND (Spring Boot Organization Backend) - Dynamic Host Port
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./aluminate-organization-backend
      dockerfile: Dockerfile
    # Exposing the port defined in the organization application.properties (8098)
    ports:
      - "8098" # Dynamic host port -> Container port 8098
    depends_on:
      - database
      - redis
      - mongo
    environment:
      #port
      ORGANIZATION_PORT: ${ORGANIZATION_PORT}
      # Database Connection
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      
      # Redis Connection
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}

      #api
      API_PREFIX: ${API_PREFIX}
      API_PREFIX_GLOBAL: ${API_PREFIX_GLOBAL}
      GLOBAL_BACKEND_URL: "${DOMAIN_LINK_GLOBAL}:${GLOBAL_PORT}"
      
      # Kafka Connection
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      
      # Keys and Secrets (Multi-line values are correctly handled since .env is quoted)
      SPRING_ORGANIZATION_PRIVATE_KEY: ${SPRING_ORGANIZATION_PRIVATE_KEY}
      SPRING_GLOBAL_PUBLIC_KEY: ${SPRING_GLOBAL_PUBLIC_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Payment and Other Config
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID}
      PAYHERE_SECRET: ${PAYHERE_SECRET}
      MONGO_URI: mongodb://mongo_root:mongo_password@mongo:27017/aluminate_chat?authSource=admin
      
      # Required for Next.js build args later
      NEXT_PUBLIC_GLOBAL_PUBLIC_KEY: ${NEXT_PUBLIC_GLOBAL_PUBLIC_KEY} 

    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 5. FRONTEND (Next.js Organization Frontend) - Dynamic Host Port
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./aluminate-organization-frontend
      dockerfile: Dockerfile
      args:
        # Pass required build arguments
        NEXT_PUBLIC_BACKEND_URL: "${DOMAIN_LINK}:${ORGANIZATION_PORT}"
        NEXT_PUBLIC_API_PREFIX: "${API_PREFIX}"
        NEXT_PUBLIC_ORGANIZATION_PUBLIC_KEY: ${NEXT_PUBLIC_ORGANIZATION_PUBLIC_KEY}
        NEXT_PUBLIC_WS_URL: "${DOMAIN_LINK_WS}:${ORGANIZATION_PORT}"
        NEXT_PUBLIC_PAYHERE_MERCHANT_ID: ${NEXT_PUBLIC_PAYHERE_MERCHANT_ID}

    ports:
      - "3000" # Dynamic host port -> Container port 3000

    depends_on:
      - backend
    networks:
      - aluminate-network

# ============================================================
# VOLUMES & NETWORKS
# ============================================================
volumes:
  pgdata:
  mongo_data:
  redis_data:

networks:
  aluminate-network:
    external: true
    name: aluminate-global-network
