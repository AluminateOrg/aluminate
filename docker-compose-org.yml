version: '3.9'

services:
  # -------------------------------------------------------------------
  # 1. DATABASE (PostgreSQL)
  # -------------------------------------------------------------------
  database:
    image: postgres:15
    container_name: ${ORG_SLUG}-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 2. MONGO DB
  # -------------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: ${ORG_SLUG}-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_root
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    volumes:
      - mongo_data:/data/db
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 3. REDIS
  # -------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: ${ORG_SLUG}-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 4. BACKEND (Spring Boot Organization Backend)
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./aluminate-organization-backend
      dockerfile: Dockerfile
    depends_on:
      - database
      - redis
      - mongo
    environment:
      ORGANIZATION_PORT: 8098 # Internal container port
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/aluminatedb
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo_root:mongo_password@mongo:27017/aluminate_chat?authSource=admin

      # External URLs point to the Traefik route (localhost:80/global_path)
      GLOBAL_BACKEND_URL: "http://global-backend:${GLOBAL_PORT}"
      ORG_SLUG: ${ORG_SLUG}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      API_PREFIX: "/${API_PREFIX}"
      API_PREFIX_GLOBAL: ${API_PREFIX_GLOBAL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ORGANIZATION_PRIVATE_KEY: ${SPRING_ORGANIZATION_PRIVATE_KEY}
      SPRING_GLOBAL_PUBLIC_KEY: ${SPRING_GLOBAL_PUBLIC_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID}
      PAYHERE_SECRET: ${PAYHERE_SECRET}
      NEXT_PUBLIC_GLOBAL_PUBLIC_KEY: ${SPRING_GLOBAL_PUBLIC_KEY}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    # TRAEFIK LABELS for Backend API (routes under /{ORG_SLUG}/backend/...)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ORG_SLUG}-backend.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/${ORG_SLUG}/backend`)"
      - "traefik.http.routers.${ORG_SLUG}-backend.entrypoints=web"
      - "traefik.http.services.${ORG_SLUG}-backend.loadbalancer.server.port=8098"
      # Strip the external prefix '/{ORG_SLUG}/backend' before forwarding to the backend container
      - "traefik.http.middlewares.${ORG_SLUG}-backend-strip.stripprefix.prefixes=/${ORG_SLUG}/backend"
      - "traefik.http.routers.${ORG_SLUG}-backend.middlewares=${ORG_SLUG}-backend-strip"

    networks:
      - aluminate-network

  # -------------------------------------------------------------------
  # 5. FRONTEND (Next.js Organization Frontend)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./aluminate-organization-frontend
      dockerfile: Dockerfile
      args:
        # Pass ORG_SLUG as a build argument
        ORG_SLUG: ${ORG_SLUG}
        # Frontend should call the backend via Traefik under /{ORG_SLUG}/backend
        NEXT_PUBLIC_BACKEND_URL: "http://${TRAEFIK_HOST}:${TRAEFIK_PORT}/${ORG_SLUG}/backend"
        NEXT_PUBLIC_API_PREFIX: "${API_PREFIX}"
        NEXT_PUBLIC_ORGANIZATION_PUBLIC_KEY: ${NEXT_PUBLIC_ORGANIZATION_PUBLIC_KEY}
        NEXT_PUBLIC_WS_URL: "ws://${TRAEFIK_HOST}:${TRAEFIK_PORT}/${ORG_SLUG}"
        NEXT_PUBLIC_PAYHERE_MERCHANT_ID: ${NEXT_PUBLIC_PAYHERE_MERCHANT_ID}
        
    depends_on:
      - backend

    labels:
      - "traefik.enable=true"
      # Match UI paths under /{ORG_SLUG} but NOT /{ORG_SLUG}/backend
      - "traefik.http.routers.${ORG_SLUG}-frontend.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`/${ORG_SLUG}`) && !PathPrefix(`/${ORG_SLUG}/backend`)"
      - "traefik.http.routers.${ORG_SLUG}-frontend.entrypoints=web"
      - "traefik.http.routers.${ORG_SLUG}-frontend.priority=10"
      - "traefik.http.services.${ORG_SLUG}-frontend.loadbalancer.server.port=3000"
      # Strip only the '/{ORG_SLUG}' prefix before forwarding to Next.js
      - "traefik.http.middlewares.${ORG_SLUG}-strip-prefix.stripprefix.prefixes=/${ORG_SLUG}"
      - "traefik.http.routers.${ORG_SLUG}-frontend.middlewares=${ORG_SLUG}-strip-prefix"

    networks:
      - aluminate-network

# ============================================================
# VOLUMES & NETWORKS
# ============================================================
volumes:
  pgdata:
  mongo_data:
  redis_data:

networks:
  aluminate-network:
    external: true
    name: aluminate-global-network
