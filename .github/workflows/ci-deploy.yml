name: Org Backend CI

on:
  pull_request:
    branches: [ production ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-org-backend-ci
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Application
        run: mvn -B clean package -DskipTests --no-transfer-progress

      - name: Build Docker Image
        run: |
          docker build --pull \
            -t aluminate/org-backend:${{ github.sha }} \
            -t aluminate/org-backend:latest \
            .

      - name: Comment PR on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Org backend build succeeded. Ready to merge to production.'
            })