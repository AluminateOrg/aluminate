# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
# Removed: spring.config.import=optional:configtree:/run/secrets/
spring.application.name=aluminate-organization-backend
server.port=${ORGANIZATION_PORT}

# for local testing on your own local postgres uncomment this
spring.docker.compose.enabled=false

# ============================================================
# DATABASE CONFIGURATION (PostgreSQL)
# Reads secrets from standard ENV vars
# ============================================================
# Connects to the 'database' service defined in docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME} 
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD} 
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# MONGO DB (CHAT DATA)
# Reads secret from standard ENV var
# ============================================================
# Connects to the 'mongo' service defined in docker-compose
spring.data.mongodb.uri=${MONGO_URI}
logging.level.org.mongodb.driver=DEBUG


# ============================================================
# REDIS (CACHING & CHAT)
# ============================================================
# Connects to the 'redis' service defined in docker-compose
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}


# ============================================================
# SECRETS (READING FROM ENVIRONMENT VARIABLES)
# ============================================================

# JWT Configuration
jwt.secret=${JWT_SECRET}
JWT_EXPIRES_IN=86400000
ORG_SLUG=${ORG_SLUG}

# Payhere
payhere.merchant_secret=${PAYHERE_SECRET}
payhere.merchant_id=${PAYHERE_MERCHANT_ID}

# Encryption Keys
encryption.organization.private-key=${SPRING_ORGANIZATION_PRIVATE_KEY}
encryption.global.public-key=${SPRING_GLOBAL_PUBLIC_KEY}

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY}

# ============================================================
# OTHER CONFIGURATION
# ============================================================

# API URLs & Prefixes
api.prefix=${API_PREFIX}
api.prefix.global=${API_PREFIX_GLOBAL}
global.backend.base-url=${GLOBAL_BACKEND_URL}

# Kafka Consumer Configuration (Connects to the global Kafka service)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=organization-service-group
# ... (rest of Kafka consumer config remains the same)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.max-poll-records=10
spring.kafka.consumer.max-poll-interval-ms=300000
spring.kafka.consumer.fetch-max-wait-ms=500
spring.kafka.consumer.fetch-min-size=1
spring.kafka.consumer.heartbeat-interval-ms=3000
spring.kafka.consumer.session-timeout-ms=10000
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aluminate.aluminate_organization_backend.config.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.aluminate.aluminate_organization_backend.config.event.GlobalEvent
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3
spring.kafka.listener.poll-timeout=5000
spring.kafka.listener.type=single

# Feign Client
feign.client.config.global-backend.connect-timeout=5000
feign.client.config.global-backend.read-timeout=5000
logging.level.com.aluminate.aluminate_organization_backend.service.auth.GlobalBackendAuthClient=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.feign=DEBUG


# Chat configuration
chat.websocket.path=/ws
chat.redis.pubsubPattern=chat:org:%s:events
chat.membership.cacheTtlSeconds=60
chat.message.maxBytes=8192
chat.ratelimit.perSecond=5
chat.ratelimit.perMinute=100

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000