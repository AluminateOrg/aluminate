# --- H2 for tests ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Embedded Kafka from @EmbeddedKafka ---
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

# Let consumers read data published before they start
spring.kafka.consumer.auto-offset-reset=earliest

# >>> Make *all* test consumers able to read NotificationRequest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aluminate.aluminate_organization_backend.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.aluminate.aluminate_organization_backend.model.NotificationRequest

# (optional) more logs while debugging
logging.level.org.springframework.kafka=INFO
logging.level.com.aluminate=INFO
