version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: aluminate_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo_root
      - MONGO_INITDB_ROOT_PASSWORD=mongo_password
      #- MONGO_URI=mongodb://mongo_root:mongo_password@localhost/aluminate_chat?authSource=admin

  redis:
    image: redis:7
    container_name: aluminate_redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data

# Example of passing environment variables to the backend service (adjust service name accordingly):
#  aluminate-organization-backend:
#    environment:
#      - MONGO_URI=mongodb://mongo_root:mongo_password@mongo:27017/aluminate_chat?authSource=admin
#      - REDIS_URI=redis://redis:6379

volumes:
  mongo_data:
  redis_data:
